name: Publish Plugin

on:
  release:
    types: [published]
  repository_dispatch:
    types: [publish-plugin]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for git tags
          ref: ${{ github.event.release.tag_name || 'main' }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Get version
        id: version
        run: |
          VERSION=$(./gradlew currentVersion -q | grep "Project version:" | sed 's/Project version: //')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Publishing version: $VERSION"

      - name: Run tests
        run: ./gradlew test

      - name: Validate Plugin
        run: ./gradlew validatePlugins

      - name: Check version availability
        id: check_version
        run: |
          # Check if version already exists
          if curl -s https://plugins.gradle.org/plugin/dev.surovtsev.claude-review/${{ steps.version.outputs.version }} | grep -q "404"; then
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "✅ Version ${{ steps.version.outputs.version }} is available for publishing"
          else
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "⚠️ Version ${{ steps.version.outputs.version }} already published"
          fi

      - name: Publish to Gradle Plugin Portal
        if: steps.check_version.outputs.exists == 'false'
        run: ./gradlew publishPlugins
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}

      - name: Verify publication
        if: steps.check_version.outputs.exists == 'false'
        run: |
          echo "⏳ Waiting for plugin to be available..."
          sleep 30

          for i in {1..10}; do
            if curl -s https://plugins.gradle.org/plugin/dev.surovtsev.claude-review | grep -q "${{ steps.version.outputs.version }}"; then
              echo "✅ Plugin v${{ steps.version.outputs.version }} successfully published!"
              echo "🔗 View at: https://plugins.gradle.org/plugin/dev.surovtsev.claude-review"
              exit 0
            fi
            echo "Waiting... ($i/10)"
            sleep 10
          done

          echo "⚠️ Plugin published but not yet visible on Portal"

      - name: Update release notes
        if: github.event_name == 'release' && steps.check_version.outputs.exists == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const release_id = context.payload.release.id;
            const currentBody = context.payload.release.body || '';

            const newBody = currentBody + '\n\n---\n✅ **Published to Gradle Plugin Portal**\n\n' +
              'Installation:\n```kotlin\nplugins {\n    id("dev.surovtsev.claude-review") version "${{ steps.version.outputs.version }}"\n}\n```\n\n' +
              '[View on Gradle Plugin Portal](https://plugins.gradle.org/plugin/dev.surovtsev.claude-review)';

            await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id,
              body: newBody
            });