name: Auto Tag Release

on:
  push:
    branches:
      - release
    paths-ignore:
      - '.github/workflows/**'
      - 'README.md'
      - 'CHANGELOG.md'

permissions:
  contents: write

jobs:
  auto-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Get current version
        id: version
        run: |
          # Get version directly (no SNAPSHOT on release branch)
          VERSION=$(./gradlew currentVersion -q | grep "Project version:" | sed 's/Project version: //')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"

          # Check if tag already exists
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "tag_exists=true" >> $GITHUB_OUTPUT
            echo "Tag v$VERSION already exists"
          else
            echo "tag_exists=false" >> $GITHUB_OUTPUT
            echo "Tag v$VERSION does not exist, will create it"
          fi

      - name: Create and push tag
        if: steps.version.outputs.tag_exists == 'false'
        run: |
          VERSION=${{ steps.version.outputs.version }}
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # Create tag
          git tag -a "v$VERSION" -m "Release v$VERSION (auto-tagged)"

          # Push tag
          git push origin "v$VERSION"

          echo "✅ Created and pushed tag v$VERSION"

      - name: Trigger publish workflow
        if: steps.version.outputs.tag_exists == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: 'publish-plugin'
            });