name: Release Branch Publish

on:
  push:
    branches:
      - release
      - release/*
  pull_request:
    branches:
      - release
    types: [closed]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run tests
        run: ./gradlew test

      - name: Validate plugin
        run: ./gradlew validatePlugins

      - name: Build plugin
        run: ./gradlew build

  publish:
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/release' || startsWith(github.ref, 'refs/heads/release/'))

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Get version
        id: version
        run: |
          VERSION=$(./gradlew currentVersion -q | grep "Project version:" | sed 's/Project version: //')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Publishing version: $VERSION"

      - name: Check if version already published
        id: check_version
        run: |
          # Check if version exists in Plugin Portal
          if curl -s https://plugins.gradle.org/plugin/dev.surovtsev.claude-review/${{ steps.version.outputs.version }} | grep -q "404"; then
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "✅ Version ${{ steps.version.outputs.version }} not yet published"
          else
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "⚠️ Version ${{ steps.version.outputs.version }} already exists"
          fi

      - name: Publish to Gradle Plugin Portal
        if: steps.check_version.outputs.exists == 'false'
        run: ./gradlew publishPlugins
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}

      - name: Create GitHub Release
        if: steps.check_version.outputs.exists == 'false'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.version }}
          release_name: Release v${{ steps.version.outputs.version }}
          body: |
            ## 🚀 Plugin v${{ steps.version.outputs.version }} Published

            The plugin has been automatically published to Gradle Plugin Portal.

            ### Installation
            ```kotlin
            plugins {
                id("dev.surovtsev.claude-review") version "${{ steps.version.outputs.version }}"
            }
            ```

            ### Links
            - [Gradle Plugin Portal](https://plugins.gradle.org/plugin/dev.surovtsev.claude-review)
            - [Documentation](https://github.com/joleksiysurovtsev/claude-review-plugin#readme)

            ---
            *This release was automatically created by GitHub Actions*
          draft: false
          prerelease: false

      - name: Notify success
        if: steps.check_version.outputs.exists == 'false'
        run: |
          echo "✅ Successfully published version ${{ steps.version.outputs.version }}"
          echo "🔗 View at: https://plugins.gradle.org/plugin/dev.surovtsev.claude-review"

      - name: Skip notification
        if: steps.check_version.outputs.exists == 'true'
        run: |
          echo "⏭️ Skipped publishing - version already exists"