name: Auto Release on Push

on:
  push:
    branches:
      - release
    paths-ignore:
      - '.github/workflows/**'
      - '*.md'
      - '.gitignore'

permissions:
  contents: write
  packages: write

jobs:
  auto-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Determine version increment
        id: version_type
        run: |
          # Анализируем последний коммит для определения типа версии
          COMMIT_MSG=$(git log -1 --pretty=%B)

          if echo "$COMMIT_MSG" | grep -qiE '\[major\]|BREAKING CHANGE'; then
            echo "type=major" >> $GITHUB_OUTPUT
            echo "📦 Major version increment detected"
          elif echo "$COMMIT_MSG" | grep -qiE '\[minor\]|feat:'; then
            echo "type=minor" >> $GITHUB_OUTPUT
            echo "📦 Minor version increment detected"
          else
            echo "type=patch" >> $GITHUB_OUTPUT
            echo "📦 Patch version increment (default)"
          fi

      - name: Calculate next version
        id: version
        run: |
          # Получаем последний тег
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Latest tag: $LATEST_TAG"

          # Убираем префикс 'v'
          CURRENT_VERSION=${LATEST_TAG#v}

          # Разделяем версию на компоненты
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          # Инкрементируем в зависимости от типа
          case "${{ steps.version_type.outputs.type }}" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          NEW_TAG="v${NEW_VERSION}"

          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "🚀 New version will be: $NEW_VERSION"

      - name: Run tests
        run: |
          echo "🧪 Running tests..."
          ./gradlew test

      - name: Validate Plugin
        run: |
          echo "✅ Validating plugin..."
          ./gradlew validatePlugins

      - name: Build
        run: |
          echo "🔨 Building project..."
          ./gradlew build

      - name: Create and push tag
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # Создаём тег
          git tag -a "${{ steps.version.outputs.new_tag }}" -m "Auto-release ${{ steps.version.outputs.new_tag }}

          Triggered by: ${{ github.event.head_commit.message }}"

          # Пушим тег
          git push origin "${{ steps.version.outputs.new_tag }}"

          echo "✅ Created and pushed tag ${{ steps.version.outputs.new_tag }}"

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.new_tag }}
          release_name: Release ${{ steps.version.outputs.new_tag }}
          draft: false
          prerelease: false
          body: |
            ## 🚀 Auto-Release ${{ steps.version.outputs.new_tag }}

            ### Installation
            ```kotlin
            plugins {
                id("dev.surovtsev.claude-review") version "${{ steps.version.outputs.new_version }}"
            }
            ```

            ### Changes
            ${{ github.event.head_commit.message }}

            ---
            *Automatically released from commit ${{ github.sha }}*

      - name: Publish to Gradle Plugin Portal
        run: |
          echo "📦 Publishing to Gradle Plugin Portal..."
          ./gradlew publishPlugins
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}

      - name: Summary
        run: |
          echo "## 🎉 Auto-Release Completed!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Version Information" >> $GITHUB_STEP_SUMMARY
          echo "- **New Version**: ${{ steps.version.outputs.new_version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag**: ${{ steps.version.outputs.new_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Type**: ${{ steps.version_type.outputs.type }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Actions Completed" >> $GITHUB_STEP_SUMMARY
          echo "✅ Tests passed" >> $GITHUB_STEP_SUMMARY
          echo "✅ Plugin validated" >> $GITHUB_STEP_SUMMARY
          echo "✅ Project built" >> $GITHUB_STEP_SUMMARY
          echo "✅ Tag created" >> $GITHUB_STEP_SUMMARY
          echo "✅ GitHub Release created" >> $GITHUB_STEP_SUMMARY
          echo "✅ Published to Gradle Plugin Portal" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Installation" >> $GITHUB_STEP_SUMMARY
          echo '```kotlin' >> $GITHUB_STEP_SUMMARY
          echo 'plugins {' >> $GITHUB_STEP_SUMMARY
          echo '    id("dev.surovtsev.claude-review") version "${{ steps.version.outputs.new_version }}"' >> $GITHUB_STEP_SUMMARY
          echo '}' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY